<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Time Tracker — Design Team</title>
  <!-- Chart.js для діаграм -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <style>
    :root {
      /* Світла тема з референсу */
      --bg-main: #F0F2F5;
      --bg-card: #FFFFFF;
      --text-main: #1D1D1F;
      --text-muted: #86868B;
      --accent-black: #000000;
      --accent-white: #FFFFFF;
      --border-color: #E5E5EA;
      --danger: #FF3B30;
      --radius: 20px;
      --shadow: 0 4px 20px rgba(0,0,0,0.04);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; }
    
    body { background-color: var(--bg-main); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    /* PIN Modal */
    .pin-overlay { position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(255,255,255,0.9); backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: center; z-index: 9999; }
    .pin-card { background: var(--bg-card); padding: 32px; border-radius: var(--radius); box-shadow: var(--shadow); text-align: center; width: 300px; }
    .pin-input { width: 100%; padding: 12px; font-size: 24px; text-align: center; border: 1px solid var(--border-color); border-radius: 12px; margin: 16px 0; outline: none; letter-spacing: 8px;}
    .btn-black { background: var(--accent-black); color: var(--accent-white); padding: 12px 24px; border-radius: 30px; border: none; font-weight: 600; cursor: pointer; width: 100%; transition: opacity 0.2s; }
    .btn-black:active { opacity: 0.7; }

    /* Layout & Nav */
    .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 16px 24px; background: var(--bg-card); box-shadow: 0 1px 0 var(--border-color); z-index: 10; }
    .nav-pills { display: flex; gap: 8px; background: var(--bg-main); padding: 4px; border-radius: 30px; }
    .nav-btn { padding: 8px 16px; border-radius: 20px; border: none; background: transparent; font-size: 14px; font-weight: 600; color: var(--text-muted); cursor: pointer; transition: all 0.2s; }
    .nav-btn.active { background: var(--accent-black); color: var(--accent-white); }
    
    .user-selector { display: flex; gap: 8px; }
    .user-pill { padding: 6px 12px; border-radius: 20px; border: 1px solid var(--border-color); background: transparent; font-size: 13px; font-weight: 500; cursor: pointer; }
    .user-pill.active { border-color: var(--accent-black); background: var(--bg-main); font-weight: 700; }

    /* Main Content Area */
    .content-area { flex: 1; overflow-y: auto; padding: 24px; display: none; }
    .content-area.active { display: block; }
    
    .section-title { font-size: 24px; font-weight: 700; margin-bottom: 20px; }
    .card { background: var(--bg-card); border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow); margin-bottom: 20px; }
    
    /* Dashboard */
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .kpi-box { background: var(--bg-main); padding: 16px; border-radius: 16px; text-align: center; }
    .kpi-val { font-size: 28px; font-weight: 700; margin-bottom: 4px; }
    .kpi-lbl { font-size: 12px; color: var(--text-muted); text-transform: uppercase; }
    .chart-container { max-width: 400px; margin: 0 auto; }

    /* Tracker */
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 8px; margin-left: 4px; }
    .form-select { width: 100%; padding: 14px; border: 1px solid var(--border-color); border-radius: 12px; font-size: 16px; background: var(--bg-main); outline: none; appearance: none; }
    
    .hours-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 24px; }
    .hour-btn { padding: 16px; border: 1px solid var(--border-color); border-radius: 16px; background: var(--bg-card); font-size: 20px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .hour-btn:hover { border-color: var(--accent-black); }
    
    /* Lists */
    .list-item { display: flex; justify-content: space-between; align-items: center; padding: 16px; border-bottom: 1px solid var(--bg-main); }
    .list-item:last-child { border-bottom: none; }
    .item-info h4 { margin-bottom: 4px; }
    .item-info p { font-size: 13px; color: var(--text-muted); }
    .actions button { background: transparent; border: none; cursor: pointer; padding: 8px; color: var(--text-muted); }
    .actions button:hover { color: var(--accent-black); }
    .actions .del-btn:hover { color: var(--danger); }

    /* Modals */
    .modal { display: none; position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.4); align-items: center; justify-content: center; z-index: 1000; padding: 24px; }
    .modal-content { background: var(--bg-card); padding: 24px; border-radius: var(--radius); width: 100%; max-width: 400px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); }
    .modal input { width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 12px; font-size: 16px; margin-bottom: 16px; }
    .modal-actions { display: flex; gap: 12px; }
    .btn-outline { background: transparent; border: 1px solid var(--border-color); color: var(--text-main); padding: 12px; border-radius: 30px; flex: 1; font-weight: 600; cursor: pointer; }

    /* Mobile Adaptations */
    @media (max-width: 768px) {
      .top-bar { flex-direction: column; gap: 16px; padding: 16px; }
      .nav-pills { width: 100%; justify-content: space-between; }
      .nav-btn { flex: 1; text-align: center; padding: 8px; }
      .content-area { padding: 16px; padding-bottom: 80px; }
    }
  </style>
</head>
<body>

  <!-- PIN Modal -->
  <div class="pin-overlay" id="pinModal">
    <div class="pin-card">
      <h2 style="margin-bottom: 8px;">Команда дизайну</h2>
      <p style="font-size: 13px; color: var(--text-muted);">Введіть PIN-код для доступу</p>
      <input type="password" id="pinInput" class="pin-input" maxlength="4" placeholder="••••">
      <button class="btn-black" onclick="checkPin()">Увійти</button>
      <p id="pinError" style="color: var(--danger); font-size: 12px; margin-top: 12px; display: none;">Невірний PIN-код</p>
    </div>
  </div>

  <!-- Header -->
  <div class="top-bar">
    <div class="nav-pills">
      <button class="nav-btn active" onclick="switchTab('dashboard', this)">Дашборд</button>
      <button class="nav-btn" onclick="switchTab('tracker', this)">Трекер</button>
      <button class="nav-btn" onclick="switchTab('projects', this)">Проєкти</button>
    </div>
    <div class="user-selector">
      <button class="user-pill active" onclick="setUser('Микола', this)">Микола</button>
      <button class="user-pill" onclick="setUser('Марго', this)">Марго</button>
      <button class="user-pill" onclick="setUser('Даша', this)">Даша</button>
    </div>
  </div>

  <!-- VIEW: DASHBOARD -->
  <div class="content-area active" id="view-dashboard">
    <div class="section-title">Огляд годин</div>
    <div class="kpi-grid">
      <div class="kpi-box">
        <div class="kpi-val" id="kpi-total">0</div>
        <div class="kpi-lbl">Всього годин</div>
      </div>
      <div class="kpi-box">
        <div class="kpi-val" id="kpi-my">0</div>
        <div class="kpi-lbl">Мої години</div>
      </div>
    </div>
    <div class="card">
      <h3 style="margin-bottom: 16px; font-size: 16px;">Розподіл за проєктами</h3>
      <div class="chart-container">
        <canvas id="projectChart"></canvas>
      </div>
    </div>
  </div>

  <!-- VIEW: TRACKER -->
  <div class="content-area" id="view-tracker">
    <div class="section-title">Зафіксувати час</div>
    <div class="card">
      <div class="form-group">
        <label>Проєкт</label>
        <select class="form-select" id="track-project-sel" onchange="renderTrackStages()"></select>
      </div>
      <div class="form-group">
        <label>Етап</label>
        <select class="form-select" id="track-stage-sel"></select>
      </div>
      <label style="display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 8px; margin-top: 24px;">Виберіть години</label>
      <div class="hours-grid">
        <button class="hour-btn" onclick="saveLog(1)">1</button>
        <button class="hour-btn" onclick="saveLog(2)">2</button>
        <button class="hour-btn" onclick="saveLog(3)">3</button>
        <button class="hour-btn" onclick="saveLog(4)">4</button>
        <button class="hour-btn" onclick="saveLog(5)">5</button>
        <button class="hour-btn" onclick="saveLog(6)">6</button>
        <button class="hour-btn" onclick="saveLog(7)">7</button>
        <button class="hour-btn" onclick="saveLog(8)">8</button>
      </div>
    </div>
    
    <h3 style="margin-bottom: 16px; font-size: 16px;">Останні записи</h3>
    <div class="card" style="padding: 0;" id="recent-logs-container">
      <!-- Logs will be here -->
    </div>
  </div>

  <!-- VIEW: PROJECTS -->
  <div class="content-area" id="view-projects">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <div class="section-title" style="margin: 0;">Управління</div>
      <button class="btn-black" style="width: auto; padding: 8px 16px;" onclick="openProjModal()">+ Проєкт</button>
    </div>
    
    <div id="projects-list-container">
      <!-- Projects list -->
    </div>
  </div>

  <!-- VIEW: PROJECT DETAILS (Internal) -->
  <div class="content-area" id="view-proj-detail">
    <button class="btn-outline" style="width: auto; padding: 6px 12px; margin-bottom: 16px; border: none;" onclick="switchTab('projects', null)">← Назад</button>
    <div class="section-title" id="detail-title">Назва</div>
    
    <div class="kpi-grid">
      <div class="kpi-box"><div class="kpi-val" id="det-kpi-total">0</div><div class="kpi-lbl">Всього на проєкті</div></div>
    </div>

    <div class="card">
      <div style="display: flex; justify-content: space-between; margin-bottom: 16px; align-items: center;">
        <h3 style="font-size: 16px;">Етапи проєкту</h3>
        <button class="btn-black" style="width: auto; padding: 6px 12px; font-size: 12px;" onclick="openStageModal()">+ Етап</button>
      </div>
      <div id="stages-list-container"></div>
    </div>

    <div class="card">
      <h3 style="font-size: 16px; margin-bottom: 16px;">Статистика (Журнал)</h3>
      <div id="detail-logs-container"></div>
    </div>

    <button class="btn-outline" style="color: var(--danger); border-color: var(--danger); width: 100%; margin-top: 16px;" onclick="archiveProject()">Відправити в архів / Видалити</button>
  </div>

  <!-- Modals -->
  <div class="modal" id="projModal">
    <div class="modal-content">
      <h3 style="margin-bottom: 16px;" id="pm-title">Новий проєкт</h3>
      <input type="text" id="pm-name" placeholder="Назва проєкту">
      <div class="modal-actions">
        <button class="btn-outline" onclick="closeModals()">Скасувати</button>
        <button class="btn-black" style="flex:1;" onclick="saveProject()">Зберегти</button>
      </div>
    </div>
  </div>

  <div class="modal" id="stageModal">
    <div class="modal-content">
      <h3 style="margin-bottom: 16px;" id="sm-title">Етап</h3>
      <input type="text" id="sm-name" placeholder="Назва етапу (напр. UI, UX, Правки)">
      <div class="modal-actions">
        <button class="btn-outline" onclick="closeModals()">Скасувати</button>
        <button class="btn-black" style="flex:1;" onclick="saveStage()">Зберегти</button>
      </div>
    </div>
  </div>


  <!-- FIREBASE & LOGIC -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Твої ключі 
    const firebaseConfig = {
      apiKey: "AIzaSyAM2qeybqi7VnFXqY0Rq-9FB076b7aF4OI",
      authDomain: "tracker-66e2f.firebaseapp.com",
      projectId: "tracker-66e2f",
      storageBucket: "tracker-66e2f.firebasestorage.app",
      messagingSenderId: "158996103708",
      appId: "1:158996103708:web:ccdd3261cdd606bc0bd5d9",
      measurementId: "G-W1GZGDV8H4"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Стейт додатку
    let currentUser = "Микола";
    let dbProjects = [];
    let dbStages = [];
    let dbLogs = [];
    let activeProjId = null;
    let editObjId = null; 
    let chartInstance = null;

    // PIN
    window.checkPin = () => {
      if(document.getElementById('pinInput').value === '0102') {
        document.getElementById('pinModal').style.display = 'none';
        sessionStorage.setItem('auth', '1');
      } else {
        document.getElementById('pinError').style.display = 'block';
      }
    }
    if(sessionStorage.getItem('auth') === '1') document.getElementById('pinModal').style.display = 'none';

    // UI Helpers
    window.switchTab = (tabId, btn) => {
      document.querySelectorAll('.content-area').forEach(el => el.classList.remove('active'));
      document.getElementById('view-' + tabId).classList.add('active');
      if(btn) {
        document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
        btn.classList.add('active');
      }
      if(tabId === 'dashboard') updateDashboard();
    }
    window.setUser = (user, btn) => {
      currentUser = user;
      document.querySelectorAll('.user-pill').forEach(el => el.classList.remove('active'));
      btn.classList.add('active');
      updateDashboard();
    }
    window.closeModals = () => {
      document.getElementById('projModal').style.display = 'none';
      document.getElementById('stageModal').style.display = 'none';
      editObjId = null;
    }

    // FIREBASE LISTENERS
    onSnapshot(collection(db, "projects_v2"), (snap) => {
      dbProjects = snap.docs.map(d => ({id: d.id, ...d.data()})).filter(p => !p.archived);
      renderProjectsList();
      renderTrackSelects();
      updateDashboard();
    });

    onSnapshot(query(collection(db, "stages_v2"), orderBy("order")), (snap) => {
      dbStages = snap.docs.map(d => ({id: d.id, ...d.data()}));
      renderTrackStages();
      if(activeProjId) renderDetailStages();
    });

    onSnapshot(query(collection(db, "logs_v2"), orderBy("ts", "desc")), (snap) => {
      dbLogs = snap.docs.map(d => ({id: d.id, ...d.data()}));
      renderRecentLogs();
      updateDashboard();
      if(activeProjId) renderDetailLogs();
    });

    // --- ПРОЄКТИ ---
    window.openProjModal = (id = null, name = '') => {
      editObjId = id;
      document.getElementById('pm-title').innerText = id ? 'Редагувати' : 'Новий проєкт';
      document.getElementById('pm-name').value = name;
      document.getElementById('projModal').style.display = 'flex';
    }
    window.saveProject = async () => {
      const name = document.getElementById('pm-name').value;
      if(!name) return;
      if(editObjId) {
        await updateDoc(doc(db, "projects_v2", editObjId), {name});
      } else {
        await addDoc(collection(db, "projects_v2"), {name, archived: false});
      }
      closeModals();
    }
    window.archiveProject = async () => {
      if(confirm("Архівувати цей проєкт? Його не буде видно в загальному списку.")) {
        await updateDoc(doc(db, "projects_v2", activeProjId), {archived: true});
        switchTab('projects', document.querySelectorAll('.nav-btn')[2]);
      }
    }
    function renderProjectsList() {
      const c = document.getElementById('projects-list-container');
      c.innerHTML = dbProjects.map(p => `
        <div class="card list-item" style="margin-bottom: 12px; padding: 16px; display: flex; border-radius: 16px;">
          <div class="item-info" style="flex:1; cursor: pointer;" onclick="openProjectDetail('${p.id}', '${p.name}')">
            <h4>${p.name}</h4>
          </div>
          <div class="actions">
            <button onclick="openProjModal('${p.id}', '${p.name}')">✏️</button>
          </div>
        </div>
      `).join('') || '<p style="color:var(--text-muted)">Немає проєктів</p>';
    }

    // --- ДЕТАЛІ ПРОЄКТУ ---
    window.openProjectDetail = (id, name) => {
      activeProjId = id;
      document.getElementById('detail-title').innerText = name;
      switchTab('proj-detail', null);
      renderDetailStages();
      renderDetailLogs();
    }

    // --- ЕТАПИ ---
    window.openStageModal = (id = null, name = '') => {
      editObjId = id;
      document.getElementById('sm-name').value = name;
      document.getElementById('stageModal').style.display = 'flex';
    }
    window.saveStage = async () => {
      const name = document.getElementById('sm-name').value;
      if(!name) return;
      if(editObjId) {
        await updateDoc(doc(db, "stages_v2", editObjId), {name});
      } else {
        const order = dbStages.filter(s => s.projectId === activeProjId).length;
        await addDoc(collection(db, "stages_v2"), {projectId: activeProjId, name, order});
      }
      closeModals();
    }
    window.moveStage = async (id, dir) => {
      const projStages = dbStages.filter(s => s.projectId === activeProjId);
      const idx = projStages.findIndex(s => s.id === id);
      if(idx < 0) return;
      if(dir === 'up' && idx > 0) {
        await updateDoc(doc(db, "stages_v2", projStages[idx].id), {order: idx-1});
        await updateDoc(doc(db, "stages_v2", projStages[idx-1].id), {order: idx});
      }
      if(dir === 'down' && idx < projStages.length - 1) {
        await updateDoc(doc(db, "stages_v2", projStages[idx].id), {order: idx+1});
        await updateDoc(doc(db, "stages_v2", projStages[idx+1].id), {order: idx});
      }
    }
    function renderDetailStages() {
      const sList = dbStages.filter(s => s.projectId === activeProjId);
      document.getElementById('stages-list-container').innerHTML = sList.map((s, i) => `
        <div class="list-item" style="padding: 12px 0;">
          <div class="item-info" style="display:flex; align-items:center; gap:8px;">
            <div style="display:flex; flex-direction:column;">
              <span style="cursor:pointer;" onclick="moveStage('${s.id}', 'up')">🔼</span>
              <span style="cursor:pointer;" onclick="moveStage('${s.id}', 'down')">🔽</span>
            </div>
            <h4>${s.name}</h4>
          </div>
          <div class="actions">
            <button onclick="openStageModal('${s.id}', '${s.name}')">✏️</button>
            <button class="del-btn" onclick="deleteStage('${s.id}')">✖</button>
          </div>
        </div>
      `).join('') || '<p style="color:var(--text-muted); font-size:13px;">Додайте етапи (напр. UX, UI, Front)</p>';
    }
    window.deleteStage = async (id) => {
      if(confirm('Видалити етап?')) await deleteDoc(doc(db, "stages_v2", id));
    }

    // --- ТРЕКЕР ТА ЛОГИ ---
    window.renderTrackSelects = () => {
      const sel = document.getElementById('track-project-sel');
      sel.innerHTML = dbProjects.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
      renderTrackStages();
    }
    window.renderTrackStages = () => {
      const pid = document.getElementById('track-project-sel').value;
      const ssel = document.getElementById('track-stage-sel');
      ssel.innerHTML = dbStages.filter(s => s.projectId === pid)
        .map(s => `<option value="${s.id}">${s.name}</option>`).join('') || '<option value="">Немає етапів</option>';
    }
    window.saveLog = async (hours) => {
      const pid = document.getElementById('track-project-sel').value;
      const sid = document.getElementById('track-stage-sel').value;
      if(!pid) return alert('Створіть проєкт!');
      
      const p = dbProjects.find(x => x.id === pid)?.name || 'Проєкт';
      const s = dbStages.find(x => x.id === sid)?.name || 'Без етапу';
      
      await addDoc(collection(db, "logs_v2"), {
        projectId: pid, projectName: p,
        stageId: sid, stageName: s,
        user: currentUser, hours: hours,
        dateStr: new Date().toLocaleDateString('uk-UA'),
        ts: Date.now()
      });
      switchTab('dashboard', document.querySelectorAll('.nav-btn')[0]);
    }
    window.deleteLog = async (id) => {
      if(confirm('Видалити запис годин?')) await deleteDoc(doc(db, "logs_v2", id));
    }
    
    function renderRecentLogs() {
      document.getElementById('recent-logs-container').innerHTML = dbLogs.slice(0,10).map(l => `
        <div class="list-item">
          <div class="item-info">
            <h4>${l.projectName} <span style="font-weight:400; color:var(--text-muted)">(${l.hours} год)</span></h4>
            <p>${l.stageName} • ${l.user} • ${l.dateStr}</p>
          </div>
          <div class="actions"><button class="del-btn" onclick="deleteLog('${l.id}')">✖</button></div>
        </div>
      `).join('') || '<p style="padding: 16px;">Поки пусто</p>';
    }

    function renderDetailLogs() {
      const pLogs = dbLogs.filter(l => l.projectId === activeProjId);
      const total = pLogs.reduce((acc, l) => acc + l.hours, 0);
      document.getElementById('det-kpi-total').innerText = total;
      
      document.getElementById('detail-logs-container').innerHTML = pLogs.map(l => `
        <div class="list-item" style="padding: 12px 0;">
          <div class="item-info">
            <h4>${l.hours} год <span style="font-size:12px; color:var(--text-muted)">[${l.stageName}]</span></h4>
            <p>${l.user} • ${l.dateStr}</p>
          </div>
          <div class="actions"><button class="del-btn" onclick="deleteLog('${l.id}')">✖</button></div>
        </div>
      `).join('') || '<p style="color:var(--text-muted); font-size:13px;">Немає записів</p>';
    }

    // --- ДАШБОРД (Графіки) ---
    function updateDashboard() {
      const myLogs = dbLogs.filter(l => l.user === currentUser);
      document.getElementById('kpi-total').innerText = dbLogs.reduce((acc, l) => acc + l.hours, 0);
      document.getElementById('kpi-my').innerText = myLogs.reduce((acc, l) => acc + l.hours, 0);

      // Підготовка даних для графіка (групування по проєктах)
      const projData = {};
      dbLogs.forEach(l => {
        projData[l.projectName] = (projData[l.projectName] || 0) + l.hours;
      });
      
      const labels = Object.keys(projData);
      const data = Object.values(projData);

      if(chartInstance) chartInstance.destroy();
      const ctx = document.getElementById('projectChart').getContext('2d');
      chartInstance = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: labels.length ? labels : ['Пусто'],
          datasets: [{
            data: data.length ? data : [1],
            backgroundColor: ['#000000', '#0a84ff', '#34c759', '#ff9f0a', '#ff3b30', '#8e8e93'],
            borderWidth: 0
          }]
        },
        options: { cutout: '70%', plugins: { legend: { position: 'bottom' } } }
      });
    }

  </script>
</body>
</html>
