document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 <\u002Fsc-if>\n              <\u002Fdiv>\n              <sc-if value=\"{{ u.resetting }}\">\n                <div style=\"display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap;\">\n                  <input value=\"{{ resetPin }}\" sc-camel-on-change=\"{{ onResetPinInput }}\" sc-camel-input-mode=\"numeric\" placeholder=\"Новий PIN — 4 цифри\" style=\"flex: 1; min-width: 160px; height: 46px; border-radius: 15px; border: 1.5px solid #0A0B0C; background: #fff; padding: 0 14px; font-size: 15px; font-weight: 700; letter-spacing: .28em; outline: none;\">\n                  <button sc-camel-on-click=\"{{ u.onResetSave }}\" style=\"height: 46px; padding: 0 18px; border-radius: 15px; background: #0A0B0C; color: #fff; font-size: 14px; font-weight: 800;\">Зберегти<\u002Fbutton>\n                  <button sc-camel-on-click=\"{{ onResetCancel }}\" style=\"height: 46px; padding: 0 16px; border-radius: 15px; background: #F2F3F5; font-size: 14px; font-weight: 800;\">Скасувати<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isArchive }}\">\n        <div style=\"display: grid; gap: 12px;\">\n          <sc-for list=\"{{ archivedProjects }}\" as=\"p\" hint-placeholder-count=\"2\">\n            <div style=\"background: #fff; border-radius: 24px; padding: 18px; box-shadow: 0 1px 2px rgba(16,18,20,.05); display: flex; align-items: center; gap: 12px; flex-wrap: wrap;\">\n              <div style=\"flex: 1; min-width: 140px;\">\n                <div style=\"font-size: 17px; font-weight: 800;\">{{ p.name }}<\u002Fdiv>\n                <div style=\"font-size: 12px; font-weight: 600; color: #7C838C;\">{{ p.meta }}<\u002Fdiv>\n              <\u002Fdiv>\n              <button sc-camel-on-click=\"{{ p.onRestore }}\" style=\"height: 42px; padding: 0 16px; border-radius: 15px; background: linear-gradient(140deg, #FCF8F1 0%, #F2E9DA 100%); font-size: 13px; font-weight: 800;\">↑ Відновити<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ p.onOpen }}\" style=\"height: 42px; padding: 0 16px; border-radius: 15px; background: #F2F3F5; font-size: 13px; font-weight: 800;\">Статистика<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ p.onDelete }}\" style=\"width: 42px; height: 42px; border-radius: 15px; background: #FEE9E9; display: flex; align-items: center; justify-content: center;\"><svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#E5484D\" stroke-width=\"2.5\" stroke-linecap=\"round\" style=\"display: block;\"><path d=\"M5 5l14 14M19 5L5 19\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <sc-if value=\"{{ noArchived }}\">\n            <div style=\"background: #fff; border-radius: 28px; padding: 40px 20px; text-align: center; font-size: 14px; font-weight: 600; color: #A9AEB5; box-shadow: 0 1px 2px rgba(16,18,20,.05);\">Архів порожній<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ showDoge }}\">\n    <div style=\"position: fixed; inset: 0; background: rgba(28,22,14,.55); backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; padding: 22px; z-index: 80;\">\n      <div style=\"width: 100%; max-width: 420px; background: linear-gradient(160deg, #FDFAF4 0%, #F1E7D6 100%); border-radius: 34px; padding: 30px 26px 26px; text-align: center; box-shadow: 0 28px 70px rgba(40,30,16,.32); animation: popIn .28s ease both;\">\n        <div style=\"width: 168px; height: 168px; margin: 0 auto; border-radius: 50%; overflow: hidden; border: 5px solid #fff; box-shadow: 0 10px 28px rgba(40,30,16,.18);\">\n          <img src=\"9c91a7b4-c4db-4bc1-bd69-06ba64eda179\" alt=\"\" style=\"width: 100%; height: 100%; object-fit: cover; display: block;\">\n        <\u002Fdiv>\n        <div style=\"font-size: 26px; font-weight: 800; color: #2A231A; margin: 22px 0 8px;\">{{ dogeTitle }}<\u002Fdiv>\n        <div style=\"font-size: 15px; font-weight: 600; color: #7A6A52; line-height: 1.45;\">{{ dogeLine }}<\u002Fdiv>\n        <button sc-camel-on-click=\"{{ onDogeClose }}\" style=\"width: 100%; height: 58px; border-radius: 20px; background: #2A231A; color: #fff; font-size: 16px; font-weight: 800; margin-top: 24px;\" style-hover=\"background: #403423\" style-active=\"transform: scale(.99)\">Спробувати знову(<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ hasConfirm }}\">\n    <div style=\"position: fixed; inset: 0; background: rgba(10,11,12,.42); display: flex; align-items: center; justify-content: center; padding: 22px; z-index: 50;\">\n      <div style=\"width: 100%; max-width: 380px; background: #fff; border-radius: 28px; padding: 26px; box-shadow: 0 24px 60px rgba(16,18,20,.25); animation: popIn .22s ease both;\">\n        <div style=\"font-size: 21px; font-weight: 800;\">{{ confirmTitle }}<\u002Fdiv>\n        <div style=\"font-size: 14px; font-weight: 600; color: #7C838C; margin-top: 8px; line-height: 1.45;\">{{ confirmText }}<\u002Fdiv>\n        <div style=\"display: flex; gap: 10px; margin-top: 22px;\">\n          <button sc-camel-on-click=\"{{ onConfirmCancel }}\" style=\"flex: 1; height: 52px; border-radius: 18px; background: #F2F3F5; font-size: 15px; font-weight: 800;\" style-hover=\"background: #E5E7EA\">Скасувати<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ onConfirmYes }}\" style=\"flex: 1; height: 52px; border-radius: 18px; background: #EF4444; color: #fff; font-size: 15px; font-weight: 800;\" style-hover=\"background: #D93636\">Видалити<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;hoursTemplateMax&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:8,&quot;min&quot;:4,&quot;max&quot;:12,&quot;tsType&quot;:&quot;number&quot;}}\">\nconst PALETTE = ['#5B5BD6', '#2E7BFF', '#E4813B', '#8B5CF6', '#12A594', '#D6A400', '#DB4F8A', '#0E7FBF', '#E5484D', '#64748B'];\nconst MONTHS = ['Січень', 'Лютий', 'Березень', 'Квітень', 'Травень', 'Червень', 'Липень', 'Серпень', 'Вересень', 'Жовтень', 'Листопад', 'Грудень'];\nconst DOW = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Нд'];\nconst DNAMES = ['Понеділок', 'Вівторок', 'Середа', 'Четвер', \"П'ятниця\", 'Субота', 'Неділя'];\nconst SESSION = 'kness_session_user';\n\nfunction iso(d) {\n  const p = (n) => String(n).padStart(2, '0');\n  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());\n}\nfunction uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4); }\nfunction initials(name) {\n  const parts = String(name || '').trim().split(/\\s+/).filter(Boolean);\n  if (!parts.length) return '?';\n  return (parts[0][0] + (parts[1] ? parts[1][0] : '')).toUpperCase();\n}\nfunction round1(n) { return Math.round(n * 10) / 10; }\n/* стать за іменем — для правильного звертання у жарті */\nconst MALE_EXCEPTIONS = ['микола', 'ілля', 'illia', 'данила', 'сава', 'кузьма', 'хома', 'лука', 'нікіта', 'микита', 'сашко', 'юра', 'вова', 'ваня', 'толя', 'сєва'];\nfunction isFemale(fullName) {\n  const first = String(fullName || '').trim().split(/\\s+/)[0].toLowerCase();\n  if (!first) return false;\n  if (MALE_EXCEPTIONS.indexOf(first) >= 0) return false;\n  return /[аяії]$/.test(first);\n}\nconst DOGE_LINES = [\n  'PIN — чотири цифри. Спробуйте ще раз, спокійно.',\n  'Такий PIN не підходить. Пес дивиться з підозрою.',\n  'Не те. Може, це PIN від картки?',\n  'Ще спроба — і пес почне записувати ваші години сам.'\n];\nfunction salt() {\n  const a = new Uint8Array(12);\n  (window.crypto || {}).getRandomValues ? window.crypto.getRandomValues(a) : a.forEach((_, i) => { a[i] = Math.floor(Math.random() * 256); });\n  return Array.from(a).map((b) => b.toString(16).padStart(2, '0')).join('');\n}\n/* SHA-256(pin + ':' + salt) — у базу потрапляє лише хеш */\nasync function hashPin(pin, s) {\n  const bytes = new TextEncoder().encode(String(pin) + ':' + s);\n  if (window.crypto && window.crypto.subtle) {\n    const buf = await window.crypto.subtle.digest('SHA-256', bytes);\n    return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, '0')).join('');\n  }\n  let h = 0;\n  for (let i = 0; i < bytes.length; i++) { h = (h * 31 + bytes[i]) >>> 0; }\n  return 'fallback' + h.toString(16);\n}\n\nclass Component extends DCLogic {\n  state = {\n    dbMode: '', dbError: '', loaded: false,\n    users: [], projects: [], entries: [],\n    userId: null, gate: 'pick', pendingId: null, pin: '', pinError: '', pinFails: 0, dogeOpen: false,\n    newUserName: '', newUserPin: '', newUserRole: 'member', userFormError: '', userFormOk: false,\n    resetId: null, resetPin: '', renameId: null, renameVal: '', openDays: {},\n    view: 'log', selId: null,\n    month: new Date().getMonth(), year: new Date().getFullYear(),\n    formHours: '', formProject: '', formStage: '', formDate: iso(new Date()),\n    saveMsg: '', saveOk: true,\n    newProjectName: '', editKind: null, editId: null, editVal: '',\n    stageDraft: {}, confirm: null,\n    dragPid: null, dragSid: null, overSid: null,\n    dragPid2: null, overPid: null,\n    notifyOn: false, notifyError: ''\n  };\n\n  componentDidMount() {\n    const start = () => {\n      const db = window.__DB;\n      if (!db) return;\n      this.db = db;\n      this.setState({ dbMode: db.mode });\n      db.subscribe((data, err) => {\n        if (err) { this.setState({ dbError: 'Помилка бази: ' + err.code }); return; }\n        const d = data || {};\n        let sessionId = null;\n        try { sessionId = sessionStorage.getItem(SESSION); } catch (e) {}\n        const users = d.users || [];\n        const keep = sessionId && users.some((u) => u.id === sessionId);\n        this.setState({\n          loaded: true, dbError: '',\n          users: users, projects: d.projects || [], entries: d.entries || [],\n          userId: keep ? sessionId : this.state.userId\n        }, () => {\n          let on = false;\n          try { on = localStorage.getItem(this.notifyKey()) === '1'; } catch (e) {}\n          if (on && typeof Notification !== 'undefined' && Notification.permission === 'granted') {\n            this.setState({ notifyOn: true });\n            this.startNotifyTimer();\n          }\n        });\n      });\n    };\n    if (window.__DB) start();\n    else window.addEventListener('db-ready', start, { once: true });\n  }\n\n  /* ── Пуш-нагадування о 17:00 у будні (Notification API).\n     Працює, поки вкладка з додатком відкрита (хоч і у фоні). ── */\n  notifyKey() { return 'kness_notify_' + (this.state.userId || 'x'); }\n  startNotifyTimer() {\n    if (this.notifyTimer) return;\n    this.notifyTimer = setInterval(() => {\n      if (!this.state.notifyOn || Notification.permission !== 'granted') return;\n      const now = new Date();\n      const dow = now.getDay();\n      if (dow === 0 || dow === 6) return;\n      if (now.getHours() !== 17 || now.getMinutes() > 4) return;\n      const stamp = iso(now);\n      let last = null;\n      try { last = localStorage.getItem('kness_notified'); } catch (e) {}\n      if (last === stamp) return;\n      const me = this.me();\n      const logged = me ? this.state.entries.filter((e) => (e.userId === me.id || e.user === me.name) && e.date === stamp).reduce((a, e) => a + e.hours, 0) : 0;\n      try { localStorage.setItem('kness_notified', stamp); } catch (e) {}\n      new Notification('Облік годин', {\n        body: logged > 0 ? 'Сьогодні зареєстровано ' + round1(logged) + ' год. Усе вірно?' : 'Не забудьте зареєструвати години за сьогодні.',\n        tag: 'kness-daily'\n      });\n    }, 60000);\n  }\n  async toggleNotify() {\n    if (this.state.notifyOn) {\n      try { localStorage.setItem(this.notifyKey(), '0'); } catch (e) {}\n      this.setState({ notifyOn: false });\n      return;\n    }\n    if (typeof Notification === 'undefined') { this.setState({ notifyError: 'Браузер не підтримує сповіщення' }); return; }\n    let perm = Notification.permission;\n    if (perm !== 'granted') perm = await Notification.requestPermission();\n    if (perm !== 'granted') { this.setState({ notifyError: 'Доступ до сповіщень заблоковано в налаштуваннях браузера' }); return; }\n    try { localStorage.setItem(this.notifyKey(), '1'); } catch (e) {}\n    this.setState({ notifyOn: true, notifyError: '' });\n    this.startNotifyTimer();\n    new Notification('Облік годин', { body: 'Готово — нагадаю щодня о 17:00 у будні.' });\n  }\n  componentWillUnmount() { if (this.notifyTimer) clearInterval(this.notifyTimer); }\n\n  write(patch) {\n    this.setState(patch, () => {\n      const s = this.state;\n      if (this.db) this.db.write({ users: s.users, projects: s.projects, entries: s.entries });\n    });\n  }\n\n  me() { return this.state.users.find((u) => u.id === this.state.userId) || null; }\n  isAdmin() { const m = this.me(); return !!m && m.role === 'admin'; }\n\n  async createUser(name, pin, role, asFirst) {\n    const n = String(name || '').trim();\n    if (n.length < 2) { this.setState({ userFormError: 'Вкажіть ім\\'я', userFormOk: false }); return; }\n    if (!/^\\d{4}$/.test(String(pin || ''))) { this.setState({ userFormError: 'PIN — рівно 4 цифри', userFormOk: false }); return; }\n    if (this.state.users.some((u) => u.name.toLowerCase() === n.toLowerCase())) {\n      this.setState({ userFormError: 'Такий користувач уже є', userFormOk: false }); return;\n    }\n    const st = salt();\n    const user = { id: uid(), name: n, role: asFirst ? 'admin' : role, pinSalt: st, pinHash: await hashPin(pin, st), createdAt: iso(new Date()) };\n    const patch = {\n      users: this.state.users.concat([user]),\n      newUserName: '', newUserPin: '', newUserRole: 'member',\n      userFormError: asFirst ? '' : 'Користувача «' + n + '» створено', userFormOk: true\n    };\n    if (asFirst) {\n      patch.userId = user.id;\n      try { sessionStorage.setItem(SESSION, user.id); } catch (e) {}\n    }\n    this.write(patch);\n  }\n\n  async resetUserPin(id) {\n    const pin = this.state.resetPin;\n    if (!/^\\d{4}$/.test(String(pin))) { this.setState({ userFormError: 'PIN — рівно 4 цифри', userFormOk: false }); return; }\n    const st = salt();\n    const hash = await hashPin(pin, st);\n    this.write({\n      users: this.state.users.map((u) => u.id === id ? Object.assign({}, u, { pinSalt: st, pinHash: hash }) : u),\n      resetId: null, resetPin: '', userFormError: 'PIN оновлено', userFormOk: true\n    });\n  }\n\n  /* Аватарка: зменшуємо до 160px і зберігаємо як data-URL у базі */\n  uploadAvatar(id, ev) {\n    const file = ev && ev.target && ev.target.files && ev.target.files[0];\n    if (!file) return;\n    if (file.size > 8 * 1024 * 1024) { this.setState({ userFormError: 'Файл завеликий (макс. 8 МБ)', userFormOk: false }); return; }\n    const reader = new FileReader();\n    reader.onload = () => {\n      const img = new Image();\n      img.onload = () => {\n        const size = 160;\n        const canvas = document.createElement('canvas');\n        canvas.width = size; canvas.height = size;\n        const ctx = canvas.getContext('2d');\n        const side = Math.min(img.width, img.height);\n        ctx.drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, size, size);\n        const data = canvas.toDataURL('image/jpeg', 0.82);\n        this.write({\n          users: this.state.users.map((u) => u.id === id ? Object.assign({}, u, { avatar: data }) : u),\n          userFormError: 'Аватарку оновлено', userFormOk: true\n        });\n      };\n      img.onerror = () => this.setState({ userFormError: 'Не вдалося прочитати зображення', userFormOk: false });\n      img.src = reader.result;\n    };\n    reader.readAsDataURL(file);\n  }\n\n  /* Перейменування профілю — ім'я підтягується і в усі старі записи */\n  renameUser(id) {\n    const val = String(this.state.renameVal || '').trim();\n    const prev = this.state.users.find((u) => u.id === id);\n    if (!prev) return;\n    if (val.length < 2) { this.setState({ userFormError: 'Ім\\'я закоротке', userFormOk: false }); return; }\n    if (this.state.users.some((u) => u.id !== id && u.name.toLowerCase() === val.toLowerCase())) {\n      this.setState({ userFormError: 'Такий користувач уже є', userFormOk: false }); return;\n    }\n    this.write({\n      users: this.state.users.map((u) => u.id === id ? Object.assign({}, u, { name: val }) : u),\n      entries: this.state.entries.map((e) => (e.userId === id || e.user === prev.name) ? Object.assign({}, e, { userId: id, user: val }) : e),\n      renameId: null, renameVal: '', userFormError: 'Ім\\'я оновлено', userFormOk: true\n    });\n  }\n\n  deleteUser(u) {\n    const admins = this.state.users.filter((x) => x.role === 'admin');\n    if (u.role === 'admin' && admins.length <= 1) {\n      this.setState({ userFormError: 'Це останній адміністратор — спершу призначте іншого', userFormOk: false });\n      return;\n    }\n    this.setState({\n      confirm: {\n        title: 'Видалити користувача?',\n        text: '«' + u.name + '» більше не зможе входити. Його зареєстровані години залишаться в статистиці.',\n        onYes: () => this.write({ users: this.state.users.filter((x) => x.id !== u.id), confirm: null })\n      }\n    });\n  }\n\n  async pressKey(k) {\n    const s = this.state;\n    if (k === 'del') { this.setState({ pin: s.pin.slice(0, -1), pinError: '' }); return; }\n    if (k === 'clr') { this.setState({ pin: '', pinError: '' }); return; }\n    const pin = (s.pin + k).slice(0, 4);\n    if (pin.length < 4) { this.setState({ pin: pin, pinError: '' }); return; }\n    this.setState({ pin: pin });\n    const u = s.users.find((x) => x.id === s.pendingId);\n    if (!u) { this.setState({ gate: 'pick', pin: '' }); return; }\n    const hash = await hashPin(pin, u.pin
