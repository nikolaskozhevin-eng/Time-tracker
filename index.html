<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TimeTracker — macOS Style</title>
  <style>
    :root {
      --bg-main: #1e1e1e;
      --bg-sidebar: #252526;
      --bg-card: #2d2d2d;
      --accent-blue: #0a84ff;
      --text-main: #ffffff;
      --text-secondary: #8e8e93;
      --border-color: #38383a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: 260px;
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      padding: 16px;
    }

    .sidebar-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }

    .project-list {
      list-style: none;
      flex-grow: 1;
      overflow-y: auto;
    }

    .project-item {
      display: flex;
      align-items: center;
      padding: 10px 12px;
      border-radius: 6px;
      cursor: pointer;
      margin-bottom: 4px;
      font-size: 14px;
      color: var(--text-main);
      transition: background 0.15s ease;
    }

    .project-item:hover {
      background-color: rgba(255, 255, 255, 0.05);
    }

    .project-item.active {
      background-color: var(--accent-blue);
    }

    .add-project-btn {
      background: transparent;
      border: 1px dashed var(--border-color);
      color: var(--text-secondary);
      padding: 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s ease;
    }

    .add-project-btn:hover {
      border-color: var(--accent-blue);
      color: var(--accent-blue);
    }

    /* Main Area */
    .main-content {
      flex-grow: 1;
      padding: 32px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 16px;
    }

    .project-header-title {
      font-size: 28px;
      font-weight: 700;
    }

    .user-selector {
      display: flex;
      background: var(--bg-card);
      padding: 4px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .user-btn {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      padding: 6px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      font-size: 13px;
    }

    .user-btn.active {
      background: var(--accent-blue);
      color: #fff;
    }

    /* Tracking Panel */
    .tracking-section {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
    }

    .section-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 16px;
      color: var(--text-secondary);
    }

    .hours-grid {
      display: flex;
      gap: 12px;
    }

    .hour-btn {
      flex: 1;
      height: 48px;
      background: var(--bg-sidebar);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .hour-btn:hover {
      background: var(--accent-blue);
      border-color: var(--accent-blue);
    }

    /* Log Table */
    .log-section {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      flex-grow: 1;
    }

    .log-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 14px;
    }

    .log-table th {
      color: var(--text-secondary);
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
      font-weight: 500;
    }

    .log-table td {
      padding: 12px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
  </style>

  <!-- Подключение Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAM2qeybqi7VnFXqY0Rq-9FB076b7aF4OI",
      authDomain: "tracker-66e2f.firebaseapp.com",
      projectId: "tracker-66e2f",
      storageBucket: "tracker-66e2f.firebasestorage.app",
      messagingSenderId: "158996103708",
      appId: "1:158996103708:web:ccdd3261cdd606bc0bd5d9",
      measurementId: "G-W1GZGDV8H4"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let activeProject = "KNESS APP";
    let currentUser = "Микола";

    // Функция обновления списка проектов
    window.selectProject = (projectName) => {
      activeProject = projectName;
      document.getElementById("current-project-title").innerText = projectName;
      document.querySelectorAll(".project-item").forEach(el => {
        el.classList.toggle("active", el.innerText.includes(projectName));
      });
      loadLogs();
    };

    window.selectUser = (userName) => {
      currentUser = userName;
      document.querySelectorAll(".user-btn").forEach(el => {
        el.classList.toggle("active", el.innerText === userName);
      });
    };

    window.addHours = async (hours) => {
      try {
        await addDoc(collection(db, "time_entries"), {
          project: activeProject,
          user: currentUser,
          hours: hours,
          date: new Date().toLocaleDateString("uk-UA")
        });
      } catch (e) {
        console.error("Ошибка сохранения: ", e);
      }
    };

    window.addNewProject = async () => {
      const name = prompt("Введіть назву нового проєкту:");
      if (name) {
        await addDoc(collection(db, "projects"), { name: name });
      }
    };

    // Слушатель событий базы в реальном времени
    onSnapshot(collection(db, "projects"), (snapshot) => {
      const list = document.getElementById("project-list");
      list.innerHTML = `<li class="project-item active" onclick="selectProject('KNESS APP')">📁 KNESS APP</li>`;
      snapshot.forEach((doc) => {
        const p = doc.data();
        if (p.name !== "KNESS APP") {
          list.innerHTML += `<li class="project-item" onclick="selectProject('${p.name}')">📁 ${p.name}</li>`;
        }
      });
    });

    function loadLogs() {
      onSnapshot(collection(db, "time_entries"), (snapshot) => {
        const tableBody = document.getElementById("log-table-body");
        tableBody.innerHTML = "";
        snapshot.forEach((doc) => {
          const data = doc.data();
          if (data.project === activeProject) {
            tableBody.innerHTML += `
              <tr>
                <td><b>${data.user}</b></td>
                <td>${data.hours} год.</td>
                <td>${data.date}</td>
              </tr>
            `;
          }
        });
      });
    }

    loadLogs();
  </script>
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-title">Проєкти</div>
    <ul class="project-list" id="project-list">
      <li class="project-item active" onclick="selectProject('KNESS APP')">📁 KNESS APP</li>
    </ul>
    <button class="add-project-btn" onclick="addNewProject()">+ Додати проєкт</button>
  </div>

  <!-- Main Content -->
  <div class="main-content">
    <div class="header">
      <h1 class="project-header-title" id="current-project-title">KNESS APP</h1>
      
      <!-- User Switcher -->
      <div class="user-selector">
        <button class="user-btn active" onclick="selectUser('Микола')">Микола</button>
        <button class="user-btn" onclick="selectUser('Марго')">Марго</button>
        <button class="user-btn" onclick="selectUser('Даша')">Даша</button>
      </div>
    </div>

    <!-- Tracking Section -->
    <div class="tracking-section">
      <div class="section-title">Зафіксувати години за сьогодні:</div>
      <div class="hours-grid">
        <button class="hour-btn" onclick="addHours(1)">1</button>
        <button class="hour-btn" onclick="addHours(2)">2</button>
        <button class="hour-btn" onclick="addHours(3)">3</button>
        <button class="hour-btn" onclick="addHours(4)">4</button>
        <button class="hour-btn" onclick="addHours(5)">5</button>
        <button class="hour-btn" onclick="addHours(6)">6</button>
        <button class="hour-btn" onclick="addHours(7)">7</button>
        <button class="hour-btn" onclick="addHours(8)">8</button>
      </div>
    </div>

    <!-- Log Section -->
    <div class="log-section">
      <div class="section-title">Журнал зафіксованого часу</div>
      <table class="log-table">
        <thead>
          <tr>
            <th>Учасник</th>
            <th>Години</th>
            <th>Дата</th>
          </tr>
        </thead>
        <tbody id="log-table-body">
          <!-- Динамически загружаемые данные -->
        </tbody>
      </table>
    </div>
  </div>

</body>
</html>
